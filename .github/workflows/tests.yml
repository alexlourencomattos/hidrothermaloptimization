name: Python stdlib tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run analytical and physical checks
        working-directory: '0. Convex Problem'
        run: python -m unittest -v
